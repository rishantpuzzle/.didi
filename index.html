
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#ff8fab">
<title>Talking Player 3D 🎮</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body,#app{
 width:100%;height:100%;height:100dvh;overflow:hidden;
 font-family:Segoe UI,system-ui,sans-serif;
 background:radial-gradient(circle at 50% 25%,#ffe4ec,#ffc2d1 55%,#ffb3c6);
 user-select:none;-webkit-user-select:none;
 -webkit-tap-highlight-color:transparent
}
#scene{position:absolute;inset:0;width:100%;height:100%;touch-action:pan-y}
#top{
 position:absolute;z-index:2;top:12px;left:0;right:0;
 display:flex;align-items:center;flex-direction:column;gap:9px;
 padding:0 10px;pointer-events:none
}
#hint,#bubble,#info{
 background:#ffffffdc;color:#a0416c;border-radius:22px;
 padding:9px 14px;font-size:13px;font-weight:800;text-align:center;
 box-shadow:0 4px 15px #ff477e20;backdrop-filter:blur(6px)
}
#bubble{
 font-size:16px;color:#ff477e;opacity:0;transform:translateY(5px);
 transition:.22s;max-width:92%;white-space:nowrap;
 overflow:hidden;text-overflow:ellipsis
}
#bubble.show{opacity:1;transform:translateY(0)}
#mic{
 position:absolute;z-index:4;bottom:max(24px,env(safe-area-inset-bottom));
 left:50%;transform:translateX(-50%);
 height:78px;width:78px;border:0;border-radius:50%;
 background:linear-gradient(135deg,#ff6b9d,#ff477e);
 box-shadow:0 8px 24px #ff477e70;color:white;font-size:32px;
 touch-action:none;cursor:pointer
}
#mic.recording{animation:pulse 1s infinite;background:#c9184a}
@keyframes pulse{50%{box-shadow:0 0 0 16px #ff477e25,0 0 40px #ff477eaa}}
#loader{
 position:absolute;z-index:5;top:50%;left:50%;transform:translate(-50%,-50%);
 color:#a0416c;font-weight:800;text-align:center;width:90%
}
#buttons{
 position:absolute;z-index:3;bottom:25px;left:10px;
 display:flex;flex-direction:column;gap:7px
}
#buttons button{
 border:1px solid #ffffff;border-radius:13px;padding:10px;
 background:#ffffffdc;color:#a0416c;font-weight:800;font-size:12px;
 cursor:pointer
}
#info{
 position:absolute;z-index:3;right:10px;bottom:35px;
 max-width:38%;font-size:10px;overflow-wrap:anywhere
}
@media(max-width:420px){
 #hint{font-size:12px}
 #mic{height:70px;width:70px}
 #buttons{left:7px;bottom:24px}
 #buttons button{padding:9px 7px}
}
</style>

<script type="importmap">
{
 "imports":{
  "three":"https://unpkg.com/three@0.160.0/build/three.module.js",
  "three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"
 }
}
</script>
</head>

<body>
<div id="app">
 <canvas id="scene"></canvas>

 <div id="top">
  <div id="hint">🎤 Mic dabao aur kuch bolo!</div>
  <div id="bubble"></div>
 </div>

 <div id="loader">Loading your 3D player...</div>

 <div id="buttons">
  <button id="jump">⬆ Bounce</button>
  <button id="shake">😂 Shake</button>
  <button id="idle">🧍 Idle</button>
 </div>

 <div id="info">Loading animations...</div>
 <button id="mic" aria-label="Press and hold to talk">🎤</button>
</div>

<script type="module">
import * as THREE from 'three';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';

// =====================================
// ELEMENTS
// =====================================
const $=s=>document.querySelector(s);
const canvas=$('#scene');
const loaderEl=$('#loader');
const hint=$('#hint');
const bubble=$('#bubble');
const mic=$('#mic');
const info=$('#info');

let ready=false;
let model=null;
let mixer=null;
let clips=[];
let idleClip=null;
let talkClip=null;
let jumpClip=null;
let shakeClip=null;
let activeAction=null;

const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(
 35,innerWidth/innerHeight,.1,1000
);

const renderer=new THREE.WebGLRenderer({
 canvas,antialias:true,alpha:true
});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;

// =====================================
// LIGHTS
// =====================================
scene.add(new THREE.HemisphereLight(0xffffff,0xffb3c6,2));

const keyLight=new THREE.DirectionalLight(0xffffff,2.4);
keyLight.position.set(4,7,5);
keyLight.castShadow=true;
keyLight.shadow.mapSize.set(1024,1024);
scene.add(keyLight);

const fillLight=new THREE.DirectionalLight(0xffb3c6,1);
fillLight.position.set(-4,3,4);
scene.add(fillLight);

const rimLight=new THREE.DirectionalLight(0xffffff,1);
rimLight.position.set(0,4,-5);
scene.add(rimLight);

const shadow=new THREE.Mesh(
 new THREE.CircleGeometry(1.6,40),
 new THREE.MeshBasicMaterial({
  color:0xa0416c,transparent:true,opacity:.15
 })
);
shadow.rotation.x=-Math.PI/2;
shadow.position.y=.01;
scene.add(shadow);

// =====================================
// PLAYER
// =====================================
const root=new THREE.Group();
scene.add(root);

const mouthTargets=[];
const blinkTargets=[];

function findClip(patterns){
 return clips.find(c=>patterns.some(p=>p.test(c.name)))||null;
}

function playClip(clip,loop=true){
 if(!mixer||!clip)return false;

 const action=mixer.clipAction(clip);
 action.reset();
 action.enabled=true;
 action.setEffectiveWeight(1);
 action.setEffectiveTimeScale(1);
 action.setLoop(
  loop?THREE.LoopRepeat:THREE.LoopOnce,
  loop?Infinity:1
 );
 action.clampWhenFinished=!loop;

 if(activeAction&&activeAction!==action){
  activeAction.fadeOut(.18);
 }
 action.fadeIn(.18).play();
 activeAction=action;
 return true;
}

function idleAnimation(){
 if(idleClip){
  playClip(idleClip,true);
 }else if(activeAction){
  activeAction.fadeOut(.15);
  activeAction=null;
 }
}

function discoverMorphs(){
 mouthTargets.length=0;
 blinkTargets.length=0;
 if(!model)return;

 model.traverse(obj=>{
  if(!obj.isMesh||!obj.morphTargetDictionary||
     !obj.morphTargetInfluences)return;

  for(const [name,index] of Object.entries(obj.morphTargetDictionary)){
   if(/mouth.?open|jaw.?open|viseme.?aa|viseme.?oh/i.test(name)){
    mouthTargets.push({obj,index});
   }
   if(/blink|eye.?close|eyes.?closed/i.test(name)){
    blinkTargets.push({obj,index});
   }
  }
 });
}

function loadPlayer(){
 new GLTFLoader().load(
  './player.glb',

  gltf=>{
   model=gltf.scene;
   clips=gltf.animations||[];

   // Normalize size and ground position
   model.updateMatrixWorld(true);
   const bounds=new THREE.Box3().setFromObject(model);
   const size=bounds.getSize(new THREE.Vector3());
   const center=bounds.getCenter(new THREE.Vector3());
   const maxSize=Math.max(size.x,size.y,size.z);

   if(!Number.isFinite(maxSize)||maxSize<=0){
    loaderEl.textContent='Invalid player.glb model';
    return;
   }

   const scale=3.4/maxSize;
   model.scale.setScalar(scale);
   model.position.set(
    -center.x*scale,
    -bounds.min.y*scale,
    -center.z*scale
   );

   model.traverse(obj=>{
    if(obj.isMesh){
     obj.castShadow=true;
     obj.receiveShadow=true;
    }
   });

   root.add(model);
   mixer=new THREE.AnimationMixer(model);

   idleClip=findClip([/idle/i,/stand/i,/breath/i,/wait/i]);
   talkClip=findClip([/talk/i,/speak/i,/chat/i,/speech/i]);
   jumpClip=findClip([/jump/i,/bounce/i,/hop/i]);
   shakeClip=findClip([/dance/i,/shake/i,/laugh/i,/react/i]);

   discoverMorphs();

   const names=clips.map(c=>c.name).filter(Boolean);
   info.textContent=names.length
    ?'Animations: '+names.join(', ')
    :'No embedded animations; procedural motion enabled';

   ready=true;
   loaderEl.style.display='none';
   fitCamera();
   idleAnimation();
   say('Player loaded! 🎮');
  },

  progress=>{
   if(progress.total>0){
    loaderEl.textContent='Loading player... '+
     Math.round(progress.loaded/progress.total*100)+'%';
   }
  },

  error=>{
   console.error('player.glb loading error:',error);
   loaderEl.textContent=
    'Player load failed. Check player.glb and Live Server.';
  }
 );
}

// =====================================
// CAMERA
// =====================================
function fitCamera(){
 camera.aspect=innerWidth/innerHeight;
 camera.fov=35;

 const fov=camera.fov*Math.PI/180;
 const distH=4.4/(2*Math.tan(fov/2));
 const distW=innerWidth/innerHeight<1
  ?3.4/(2*Math.tan(fov/2)*camera.aspect):0;

 const distance=Math.max(distH,distW)*1.18;
 camera.position.set(0,1.85,distance);
 camera.lookAt(0,1.65,0);
 camera.updateProjectionMatrix();
}

fitCamera();

addEventListener('resize',()=>{
 renderer.setSize(innerWidth,innerHeight);
 fitCamera();
});

// =====================================
// SPEECH BUBBLE
// =====================================
let bubbleTimer;

function say(text,ms=1600){
 bubble.textContent=text;
 bubble.classList.add('show');
 clearTimeout(bubbleTimer);
 bubbleTimer=setTimeout(()=>{
  bubble.classList.remove('show');
 },ms);
}

function speakReaction(text){
 if(!('speechSynthesis' in window))return;

 speechSynthesis.cancel();
 const utterance=new SpeechSynthesisUtterance(text);
 utterance.pitch=1.6;
 utterance.rate=1.12;
 utterance.volume=.9;

 const voices=speechSynthesis.getVoices();
 const voice=voices.find(v=>
  /female|zira|samantha|google.*(uk|us)/i.test(v.name)
 );
 if(voice)utterance.voice=voice;

 speechSynthesis.speak(utterance);
}

// =====================================
// MIC + FUNNY VOICE
// =====================================
let audioContext=null;
let analyser=null;
let stream=null;
let recorder=null;
let chunks=[];
let recording=false;
let playing=false;
let recordStart=0;
let stopTimer=null;

const MAX_RECORD_MS=8000;
const MIN_RECORD_MS=300;
const PITCH_RATE=1.65;

function initAudio(){
 if(!audioContext){
  audioContext=new(window.AudioContext||window.webkitAudioContext)();
  analyser=audioContext.createAnalyser();
  analyser.fftSize=256;
  analyser.smoothingTimeConstant=.4;
 }
 if(audioContext.state==='suspended')audioContext.resume();
}

async function startRecording(){
 if(recording||playing)return;

 try{
  if('speechSynthesis' in window)speechSynthesis.cancel();
  initAudio();

  if(!navigator.mediaDevices?.getUserMedia){
   throw new Error('Microphone requires HTTPS or localhost');
  }

  if(!stream){
   stream=await navigator.mediaDevices.getUserMedia({
    audio:{echoCancellation:true,noiseSuppression:true}
   });
  }

  // Prevent overlapping permission requests
  if(recording)return;

  chunks=[];
  let mime='';

  for(const type of [
   'audio/webm;codecs=opus','audio/webm','audio/mp4'
  ]){
   if(MediaRecorder.isTypeSupported(type)){
    mime=type;
    break;
   }
  }

  recorder=new MediaRecorder(
   stream,mime?{mimeType:mime}:{}
  );

  recorder.ondataavailable=e=>{
   if(e.data.size>0)chunks.push(e.data);
  };
  recorder.onstop=recordingStopped;
  recorder.start();

  recording=true;
  recordStart=Date.now();
  mic.classList.add('recording');
  hint.textContent='🔴 Sun raha hoon... bolo!';

  stopTimer=setTimeout(stopRecording,MAX_RECORD_MS);

 }catch(error){
  console.error(error);
  say('Mic permission allow karo 🎤',2300);
  hint.textContent='Mic allow karke dobara try karo';
 }
}

function stopRecording(){
 if(!recording)return;

 clearTimeout(stopTimer);
 const elapsed=Date.now()-recordStart;
 recording=false;
 mic.classList.remove('recording');

 if(elapsed<MIN_RECORD_MS){
  chunks=[];
  hint.textContent='🎤 Mic dabao aur kuch bolo!';
 }

 if(recorder&&recorder.state!=='inactive'){
  recorder.stop();
 }
}

async function recordingStopped(){
 if(!chunks.length)return;

 const blob=new Blob(chunks,{
  type:recorder?.mimeType||'audio/webm'
 });
 chunks=[];

 try{
  const buffer=await blob.arrayBuffer();
  const audioBuffer=await audioContext.decodeAudioData(buffer);
  playFunnyVoice(audioBuffer);
 }catch(error){
  console.error(error);
  say('Audio play nahi hua, dobara try karo',2200);
  hint.textContent='🎤 Mic dabao aur kuch bolo!';
 }
}

function playFunnyVoice(buffer){
 playing=true;
 hint.textContent='😂 Funny voice playing...';

 if(talkClip)playClip(talkClip,true);

 const source=audioContext.createBufferSource();
 source.buffer=buffer;
 source.playbackRate.value=PITCH_RATE;
 source.connect(analyser);
 analyser.connect(audioContext.destination);

 source.onended=()=>{
  playing=false;
  try{
   source.disconnect();
   analyser.disconnect();
  }catch{}
  idleAnimation();
  hint.textContent='🎤 Mic dabao aur kuch bolo!';
 };

 try{
  source.start();
 }catch(error){
  console.error(error);
  playing=false;
  idleAnimation();
 }
}

mic.addEventListener('pointerdown',e=>{
 e.preventDefault();
 initAudio();
 startRecording();
});
mic.addEventListener('pointerup',e=>{
 e.preventDefault();
 stopRecording();
});
mic.addEventListener('pointercancel',stopRecording);
mic.addEventListener('lostpointercapture',stopRecording);

// =====================================
// REACTIONS
// =====================================
let bounceTimer=0;
let shakeTimer=0;
let mouthValue=0;
let blinkTimer=2;
let blinkValue=0;

function react(part){
 if(!ready||recording||playing)return;

 const reactions={
  head:['Ouch! 😄','Ouch!'],
  face:['Hihi! 😊','Hihi!'],
  eyes:['Hiii! 💕','Hiii!'],
  body:['Hahaha! 🤣','Hahaha!']
 };

 const reaction=reactions[part]||reactions.face;
 say(reaction[0]);
 speakReaction(reaction[1]);

 if(part==='body'){
  shakeTimer=.7;
  if(shakeClip)playClip(shakeClip,false);
 }else{
  bounceTimer=.7;
  if(jumpClip)playClip(jumpClip,false);
 }
}

const raycaster=new THREE.Raycaster();
const pointer=new THREE.Vector2();

canvas.addEventListener('pointerdown',event=>{
 if(!ready||recording||playing)return;

 pointer.x=event.clientX/innerWidth*2-1;
 pointer.y=-(event.clientY/innerHeight)*2+1;

 raycaster.setFromCamera(pointer,camera);
 const hits=raycaster.intersectObject(root,true);
 if(!hits.length)return;

 const y=hits[0].point.y;
 react(y>2.3?'head':y>1.5?'face':'body');
});

// =====================================
// ANIMATION BUTTONS
// =====================================
$('#jump').addEventListener('click',()=>{
 if(!ready)return;
 bounceTimer=.7;
 if(jumpClip)playClip(jumpClip,false);
 else say('⬆ Bounce!');
});

$('#shake').addEventListener('click',()=>{
 if(!ready)return;
 shakeTimer=.7;
 if(shakeClip)playClip(shakeClip,false);
 else say('😂 Shake!');
});

$('#idle').addEventListener('click',()=>{
 bounceTimer=0;
 shakeTimer=0;
 idleAnimation();
});

// =====================================
// ANIMATION LOOP
// =====================================
let previous=performance.now();
let elapsed=0;

function animate(now){
 requestAnimationFrame(animate);

 const dt=Math.min(.05,(now-previous)/1000);
 previous=now;
 elapsed+=dt;

 if(mixer)mixer.update(dt);

 if(ready){
  // Gentle procedural idle movement
  root.position.y=Math.sin(elapsed*1.5)*.025;
  root.rotation.y=Math.sin(elapsed*.45)*.06;

  // Bounce fallback if model has no jump clip
  if(bounceTimer>0){
   bounceTimer=Math.max(0,bounceTimer-dt);
   if(!jumpClip){
    const p=1-bounceTimer/.7;
    root.position.y+=Math.sin(p*Math.PI)*.42;
   }
  }

  // Shake fallback if model has no shake clip
  if(shakeTimer>0){
   shakeTimer=Math.max(0,shakeTimer-dt);
   if(!shakeClip){
    root.rotation.z=Math.sin(elapsed*38)*.12*(shakeTimer/.7);
   }
  }else{
   root.rotation.z*=.85;
  }
 }

 // Mouth morph targets react to recorded audio
 let targetMouth=0;
 if(playing&&analyser){
  const data=new Uint8Array(analyser.fftSize);
  analyser.getByteTimeDomainData(data);

  let sum=0;
  for(const sample of data){
   const v=(sample-128)/128;
   sum+=v*v;
  }
  targetMouth=Math.min(1,Math.sqrt(sum/data.length)*4);
 }

 mouthValue+=(targetMouth-mouthValue)*Math.min(1,dt*18);
 for(const m of mouthTargets){
  m.obj.morphTargetInfluences[m.index]=mouthValue;
 }

 // Blink when the model has a blink morph target
 blinkTimer-=dt;
 if(blinkTimer<=0){
  blinkValue=1;
  blinkTimer=2.5+Math.random()*3;
 }
 blinkValue=Math.max(0,blinkValue-dt*12);

 for(const b of blinkTargets){
  b.obj.morphTargetInfluences[b.index]=blinkValue;
 }

 renderer.render(scene,camera);
}

document.addEventListener('contextmenu',e=>e.preventDefault());

if('speechSynthesis' in window){
 speechSynthesis.getVoices();
 speechSynthesis.onvoiceschanged=()=>speechSynthesis.getVoices();
}

loadPlayer();
requestAnimationFrame(animate);
</script>
</body>
</html>
</body>
</html>
